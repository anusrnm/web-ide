<!DOCTYPE html>
<html>
<head>
<title>Web IDE</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">

<script src="https://unpkg.com/monaco-editor@0.55.1/min/vs/loader.js"></script>

<style>
* { box-sizing:border-box; }

html, body {
    margin:0;
    height:100%;
    overflow:hidden;
    font-family:Segoe UI, Roboto, Arial, sans-serif;
    background:#1e1e1e;
    color:#d4d4d4;
}

body { display:flex; }

#explorer {
    width:280px;
    min-width:180px;
    max-width:600px;
    background:#181818;
    color:#cfcfcf;
    border-right:1px solid #2f2f2f;
    overflow:hidden;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

#divider {
    width:6px;
    cursor:col-resize;
    background:#252525;
}

#main {
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    min-height:0;
    overflow:hidden;
}

#editor-container {
    flex:1;
    min-height:0;
    min-width:0;
    position:relative;
    overflow:hidden;
}

#tabs {
    display:flex;
    background:#252526;
    border-bottom:1px solid #333;
    overflow-x:auto;
    overflow-y:hidden;
    white-space:nowrap;
    min-height:34px;
    flex-shrink:0;
}

.tab {
    padding:7px 10px;
    border-right:1px solid #343434;
    cursor:pointer;
    color:#c9c9c9;
    display:inline-flex;
    align-items:center;
    gap:8px;
    max-width:260px;
    min-width:110px;
    font-size:12px;
}

.tab-label {
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.pin-icon {
    width:14px;
    height:14px;
    cursor:pointer;
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    color:#888;
    font-size:11px;
    opacity:0;
    transition:opacity 0.2s;
}

.tab:hover .pin-icon {
    opacity:1;
}

.pin-icon.pinned {
    opacity:1;
    color:#4fc1ff;
}

.pin-icon:hover { color:#fff; }

#explorer.hidden {
    display:none;
}

#divider.explorer-hidden {
    cursor:default;
    opacity:0.5;
}

.toggle-explorer-btn {
    cursor:pointer;
    width:14px;
    height:14px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    color:#7fb3ff;
    font-size:10px;
    margin-right:4px;
}

.toggle-explorer-btn:hover { color:#fff; }

.tab:hover { background:#2d2d30; }

.tab.active {
    background:#1e1e1e;
    color:#ffffff;
}

.tab.dirty .tab-label::after {
    content:" •";
    color:#4fc1ff;
}

.close {
    color:#d0d0d0;
    cursor:pointer;
    font-size:13px;
}

.close:hover { color:#ff7b72; }

#editor {
    position:absolute;
    inset:0;
}

#image-preview {
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
    background:
        linear-gradient(45deg, rgba(255,255,255,0.05) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255,255,255,0.05) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.05) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.05) 75%),
        #1a1a1a;
    background-size:24px 24px;
    background-position:0 0, 0 12px, 12px -12px, -12px 0;
    padding:18px;
}

#image-preview.visible {
    display:flex;
}

#image-preview img {
    max-width:100%;
    max-height:calc(100% - 28px);
    object-fit:contain;
    border:1px solid #3d3d3d;
    box-shadow:0 10px 28px rgba(0,0,0,.4);
    background:#111;
}

#image-preview .image-caption {
    color:#cecece;
    font-size:12px;
    text-align:center;
}

#statusbar {
    height:22px;
    background:#007acc;
    color:white;
    font-size:11px;
    padding:0 10px;
    display:flex;
    align-items:center;
    line-height:22px;
    flex-shrink:0;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    border-top:1px solid rgba(255,255,255,0.16);
}

.explorer-title {
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:#9d9d9d;
    margin:0;
}

.toolbar {
    display:flex;
    gap:8px;
    margin:0;
}

.icon-btn {
    cursor:pointer;
    width:28px;
    height:28px;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#232323;
    border:1px solid #333;
    color:#dadada;
}

.icon-btn:hover { background:#2d2d2d; }

.icon-btn svg {
    width:16px;
    height:16px;
}

#search {
    width:100%;
    margin:0;
    border:1px solid #3d3d3d;
    background:#111;
    color:#e5e5e5;
    border-radius:6px;
    padding:6px 8px;
    outline:none;
    font-size:12px;
}

#search:focus {
    border-color:#007acc;
}

#tree {
    flex:1;
    overflow:auto;
    min-height:0;
    padding-right:4px;
}

#tree ul {
    list-style:none;
    margin:0;
    padding-left:14px;
}

#tree > ul { padding-left:0; }

.tree-item {
    cursor:pointer;
    user-select:none;
    padding:4px 8px;
    border-radius:6px;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
}

.tree-item:hover { background:#2a2a2a; }

.tree-item.selected {
    background:#094771;
    color:#ffffff;
}

.tree-item.multi-selected {
    outline:1px solid #0e639c;
    outline-offset:-1px;
}

.tree-caret {
    color:#a7a7a7;
    width:12px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.tree-icon {
    width:14px;
    height:14px;
    display:inline-flex;
    flex-shrink:0;
}

.tree-label {
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.tree-item.folder .tree-icon svg { color:#dcb67a; }
.tree-item.file .tree-icon svg { color:#7fb3ff; }

.tree-item.selected .tree-caret,
.tree-item.selected .tree-icon svg { color:#ffffff; }

.context-menu {
    position:fixed;
    z-index:2000;
    display:none;
    min-width:170px;
    background:#252526;
    border:1px solid #3a3a3a;
    border-radius:6px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
    padding:4px;
}

.context-item {
    width:100%;
    border:none;
    background:transparent;
    color:#d4d4d4;
    text-align:left;
    font-size:12px;
    padding:6px 8px;
    border-radius:4px;
    cursor:pointer;
}

.context-item:hover {
    background:#094771;
    color:#ffffff;
}

.context-separator {
    height:1px;
    background:#3a3a3a;
    margin:4px 2px;
}

.inline-input {
    border:1px solid #007acc;
    background:#111;
    color:#e5e5e5;
    border-radius:4px;
    padding:3px 6px;
    font-size:12px;
    outline:none;
    font-family:Segoe UI, Roboto, Arial, sans-serif;
}

#command-palette {
    position:fixed;
    z-index:3000;
    display:none;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:rgba(0,0,0,0.6);
    align-items:flex-start;
    justify-content:center;
    padding-top:10vh;
}

.palette-box {
    min-width:500px;
    max-width:600px;
    background:#252526;
    border:1px solid #3a3a3a;
    border-radius:8px;
    box-shadow:0 16px 32px rgba(0,0,0,.5);
    overflow:hidden;
    max-height:70vh;
    display:flex;
    flex-direction:column;
}

.palette-input {
    padding:10px 12px;
    border:none;
    background:#1e1e1e;
    color:#e5e5e5;
    font-size:13px;
    outline:none;
    border-bottom:1px solid #3a3a3a;
    font-family:Segoe UI, Roboto, Arial, sans-serif;
}

.palette-items {
    flex:1;
    overflow-y:auto;
    min-height:0;
}

.palette-item {
    padding:7px 12px;
    cursor:pointer;
    color:#d4d4d4;
    font-size:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.palette-item:hover,
.palette-item.highlighted {
    background:#094771;
    color:#ffffff;
}

.palette-hint {
    color:#888;
    font-size:11px;
}
</style>
</head>
<body>

<div id="explorer">
    <p class="explorer-title">Explorer</p>
    <div class="toolbar">
        <button class="icon-btn" id="toggle-explorer-btn" onclick="toggleExplorer()" title="Toggle Explorer" aria-label="Toggle Explorer"></button>
        <button class="icon-btn" id="new-file-btn" onclick="createItem('file')" title="New File" aria-label="New File"></button>
        <button class="icon-btn" id="new-folder-btn" onclick="createItem('folder')" title="New Folder" aria-label="New Folder"></button>
        <button class="icon-btn" id="download-btn" onclick="downloadSelectedFromExplorer()" title="Download Selected" aria-label="Download Selected"></button>
        <button class="icon-btn" id="logout-btn" onclick="logout()" title="Logout" aria-label="Logout">⎋</button>
    </div>
    <input id="search" placeholder="Search files...">
    <div id="tree"></div>
</div>

<div id="divider"></div>

<div id="main">
    <div id="tabs"></div>
    <div id="editor-container">
        <div id="editor"></div>
        <div id="image-preview">
            <img id="image-preview-img" alt="Image preview">
            <div id="image-preview-caption" class="image-caption"></div>
        </div>
    </div>
    <div id="statusbar">Ready</div>
</div>

<div id="explorer-context-menu" class="context-menu"></div>

<div id="command-palette">
    <div class="palette-box">
        <input id="palette-input" class="palette-input" type="text" placeholder="Type command name...">
        <div id="palette-items" class="palette-items"></div>
    </div>
</div>

<script>
require.config({
    paths:{'vs':'https://unpkg.com/monaco-editor@0.55.1/min/vs'}
});

let editor;
let diffEditor;
let models = {};
let modelListeners = {};
let dirtyFiles = {};
let currentFile = null;
let compareMode = false;
let compareCandidatePath = null;
let compareOriginalPath = null;
let compareModifiedPath = null;
let compareReturnPath = null;
let compareReadOnlyModels = {};
let selectedTreePath = null;
let selectedTreePaths = new Set();
let lastSelectedTreePath = null;
let menuTarget = null;
let closedTabs = [];
let recentFiles = [];
let inlineEditState = null;
let pendingInlineEdit = false;
let pinnedTabs = {};
let explorerHidden = false;
let fileMetadata = {};
let remoteFileSnapshots = {};
let conflictFiles = {};
let autoSaveTimers = {};
let saveInFlight = {};
let suppressModelChanges = {};
let treeVersion = null;
let treeFilePaths = [];
let watchTimer = null;
let paletteMode = "commands";
let paletteEntries = [];
let paletteFilteredEntries = [];
let paletteHighlightIndex = 0;
let imageFiles = {};

const MAX_RECENT = 12;
const STORAGE_KEY = "ide_recentFiles";
const READY_STATUS = "Ready";
const AUTO_SAVE_DELAY = 1500;
const WATCH_INTERVAL = 3000;
const DEFAULT_PALETTE_PLACEHOLDER = "Type command name...";

function loadRecentFiles(){
    try {
        const stored = localStorage.getItem(STORAGE_KEY);
        recentFiles = stored ? JSON.parse(stored) : [];
    } catch {
        recentFiles = [];
    }
}

function saveRecentFiles(){
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(recentFiles.slice(0, MAX_RECENT)));
    } catch {}
}

function addRecentFile(path){
    path = normalizePath(path);
    recentFiles = recentFiles.filter(p => p !== path);
    recentFiles.unshift(path);
    if(recentFiles.length > MAX_RECENT) recentFiles.pop();
    saveRecentFiles();
}

function removeRecentFile(path){
    path = normalizePath(path);
    recentFiles = recentFiles.filter(p => p !== path);
    saveRecentFiles();
}

function createIcon(name){
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.setAttribute("width", "16");
    svg.setAttribute("height", "16");
    svg.setAttribute("fill", "currentColor");

    const addPath = (d) => {
        const path = document.createElementNS(ns, "path");
        path.setAttribute("d", d);
        path.setAttribute("fill", "currentColor");
        svg.appendChild(path);
    };

    if(name === "file"){
        addPath("M2 2h8v3h4v9H2V2zm2 10h8V7h-3V4H4v8z");
    } else if(name === "folder"){
        addPath("M2 3h4l2 2h6v8H2V3z");
    } else if(name === "filePlus"){
        addPath("M2 2h8v3h4v9H2V2zm5 6v2h2v1H7v2h-1v-2H4v-1h2V8h1z");
    } else if(name === "folderPlus"){
        addPath("M2 3h4l2 2h6v8H2V3zm6 3v2h2v1H8v2H7v-2H5v-1h2V6h1z");
    } else if(name === "sidebar"){
        addPath("M2 2h12v12H2V2zm1 1v10h3V3H3zm4 0v10h6V3H7z");
    } else if(name === "download"){
        addPath("M3 11h10v2H3v-2zm5-9h1v5.6l2.1-2.1.7.7L8.5 9.5 5.2 6.2l.7-.7L8 7.6V2z");
    } else if(name === "chevronRight"){
        addPath("M5.5 3L10 8l-4.5 5V10zm3 5l-3-4.5v9L8.5 8z");
    } else if(name === "chevronDown"){
        addPath("M13 5.5l-5 4.5-5-4.5v3l5 4.5 5-4.5v-3z");
    }

    return svg;
}

function setIcon(container, iconName){
    container.innerHTML = "";
    container.appendChild(createIcon(iconName));
}

function initToolbarIcons(){
    const toggleExplorerButton = document.getElementById("toggle-explorer-btn");
    const newFile = document.getElementById("new-file-btn");
    const newFolder = document.getElementById("new-folder-btn");
    const downloadButton = document.getElementById("download-btn");
    if(toggleExplorerButton) setIcon(toggleExplorerButton, "sidebar");
    if(newFile) setIcon(newFile, "filePlus");
    if(newFolder) setIcon(newFolder, "folderPlus");
    if(downloadButton) setIcon(downloadButton, "download");
}

function initContextMenu(){
    document.addEventListener("click", hideContextMenu);
    document.addEventListener("keydown", (event)=>{
        if(event.key === "Escape") hideContextMenu();
    });

    const tree = document.getElementById("tree");
    tree.addEventListener("contextmenu", (event)=>{
        const item = event.target.closest(".tree-item");
        if(item) return;
        event.preventDefault();
        openContextMenu(event.clientX, event.clientY, { type: "root", path: "" });
    });
}

async function resolveModelForCompare(path){
    path = normalizePath(path);
    
    if(models[path]){
        return { model: models[path], isReadOnly: false };
    }
    
    try {
        const data = await requestJson("/open",{
            method:"POST",
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({path})
        });
        
        const model = monaco.editor.createModel(
            data.isImage ? buildImagePreviewPlaceholder(path) : data.content,
            data.isImage ? "plaintext" : detectLanguage(path)
        );
        compareReadOnlyModels[path] = model;
        return { model: model, isReadOnly: true };
    } catch (error) {
        throw error;
    }
}

function exitCompareMode(){
    if(!compareMode) return;

    const returnPath = compareReturnPath;

    if(diffEditor){
        diffEditor.dispose();
        diffEditor = null;
    }

    Object.keys(compareReadOnlyModels).forEach(path => {
        const model = compareReadOnlyModels[path];
        if(model) model.dispose();
    });
    compareReadOnlyModels = {};

    compareMode = false;
    compareCandidatePath = null;
    compareOriginalPath = null;
    compareModifiedPath = null;
    compareReturnPath = null;

    const editorContainer = document.getElementById('editor');
    editorContainer.innerHTML = '';
    editor = monaco.editor.create(editorContainer, {
        theme:'vs-dark',
        automaticLayout:true
    });
    editor.onDidChangeCursorPosition(updateStatus);

    currentFile = returnPath && models[returnPath] ? returnPath : null;
    if(currentFile && models[currentFile]){
        setActive(currentFile);
    } else {
        editor.setModel(null);
        hideImagePreview();
        setStatus(READY_STATUS);
    }
}

async function startCompare(originalPath, modifiedPath){
    try {
        originalPath = normalizePath(originalPath);
        modifiedPath = normalizePath(modifiedPath);

        hideImagePreview();

        const origData = await resolveModelForCompare(originalPath);
        const modData = await resolveModelForCompare(modifiedPath);

        if(diffEditor) diffEditor.dispose();

        const editorContainer = document.getElementById('editor');
        editorContainer.innerHTML = '';

        diffEditor = monaco.editor.createDiffEditor(editorContainer, {
            theme:'vs-dark',
            automaticLayout:true,
            readOnly:false,
            originalEditable:false
        });

        diffEditor.setModel({
            original: origData.model,
            modified: modData.model
        });

        compareMode = true;
        compareOriginalPath = originalPath;
        compareModifiedPath = modifiedPath;
        compareReturnPath = modifiedPath;
        currentFile = null;

        setStatus(`Comparing: ${basename(originalPath)} ↔ ${basename(modifiedPath)}`);
    } catch (error) {
        setStatus(`Compare failed: ${error.message}`, true);
        exitCompareMode();
    }
}

async function startCompareWithContent(path, originalContent, originalLabel="Disk"){
    path = normalizePath(path);

    hideImagePreview();

    if(!models[path]){
        setStatus(`Compare failed: ${basename(path)} is not open`, true);
        return;
    }

    const compareKey = `__compare__:${path}`;
    if(compareReadOnlyModels[compareKey]){
        compareReadOnlyModels[compareKey].dispose();
    }

    compareReadOnlyModels[compareKey] = monaco.editor.createModel(
        originalContent,
        detectLanguage(path)
    );

    if(diffEditor) diffEditor.dispose();

    const editorContainer = document.getElementById('editor');
    editorContainer.innerHTML = '';

    diffEditor = monaco.editor.createDiffEditor(editorContainer, {
        theme:'vs-dark',
        automaticLayout:true,
        readOnly:false,
        originalEditable:false
    });

    diffEditor.setModel({
        original: compareReadOnlyModels[compareKey],
        modified: models[path]
    });

    compareMode = true;
    compareOriginalPath = compareKey;
    compareModifiedPath = path;
    compareReturnPath = path;
    currentFile = null;

    setStatus(`Comparing: ${originalLabel} ↔ ${basename(path)}`);
}

require(['vs/editor/editor.main'], function(){
    editor = monaco.editor.create(document.getElementById('editor'), {
        theme:'vs-dark',
        automaticLayout:true
    });

    editor.onDidChangeCursorPosition(updateStatus);

    window.addEventListener("keydown", e=>{
        if(e.ctrlKey && e.key==="s"){
            e.preventDefault();
            save();
        }
    });

    loadTree().then(()=>{
        ensureWatchPolling();
        pollWorkspaceUpdates();
    });
});

initToolbarIcons();
initContextMenu();

function buildCommandRegistry(){
    const baseActions = {
        newFile: async ()=> createItem("file"),
        newFolder: async ()=> createItem("folder"),
        quickOpen: async ()=> showQuickOpenPalette(),
        toggleExplorer: async ()=> toggleExplorer(),
        findInFile: async ()=> {
            const activeEditor = getActiveEditorInstance();
            if(activeEditor){
                activeEditor.getAction("actions.find").run();
            }
        },
        saveFile: async ()=> save(),
        downloadSelected: async ()=> downloadSelectedFromExplorer(),
        saveAll: async ()=> {
            const activePath = currentFile;
            for(const path of Object.keys(models)){
                if(dirtyFiles[path]){
                    await save(path, { reason: "manual" });
                }
            }
            if(activePath && models[activePath] && !compareMode){
                setActive(activePath);
            }
            setStatus("All files saved");
        },
        reopenClosedTab: async ()=> {
            if(closedTabs.length){
                const path = closedTabs.pop();
                await openFile(path);
            }
        },
        openRecent: async ()=> {
            if(!recentFiles.length){
                setStatus("No recent files");
                return;
            }
            showRecentPalette();
        },
        undo: async ()=> {
            const activeEditor = getActiveEditorInstance();
            if(activeEditor && activeEditor.hasTextFocus()) activeEditor.trigger('keyboard', 'undo');
        },
        redo: async ()=> {
            const activeEditor = getActiveEditorInstance();
            if(activeEditor && activeEditor.hasTextFocus()) activeEditor.trigger('keyboard', 'redo');
        },
        selectForCompare: async ()=> {
            if(!currentFile){
                setStatus("No file open to select for compare", true);
                return;
            }
            compareCandidatePath = currentFile;
            setStatus(`Selected for compare: ${basename(currentFile)}`);
        },
        compareWithSelected: async ()=> {
            if(!compareCandidatePath){
                setStatus("No file selected for compare", true);
                return;
            }
            if(!currentFile){
                setStatus("No file open to compare", true);
                return;
            }
            await startCompare(compareCandidatePath, currentFile);
        },
        exitCompare: async ()=> {
            if(!compareMode){
                setStatus("Not in compare mode", true);
                return;
            }
            exitCompareMode();
        }
    };

    const commands = [
        { id: "quickOpen", label: "Quick Open", action: baseActions.quickOpen, keys: "Ctrl+P" },
        { id: "toggleExplorer", label: "Toggle Explorer", action: baseActions.toggleExplorer, keys: "Ctrl+B" },
        { id: "findInFile", label: "Find In File", action: baseActions.findInFile, keys: "Ctrl+F" },
        { id: "newFile", label: "New File", action: baseActions.newFile, keys: "" },
        { id: "newFolder", label: "New Folder", action: baseActions.newFolder, keys: "" },
        { id: "saveFile", label: "Save File", action: baseActions.saveFile, keys: "Ctrl+S" },
        { id: "downloadSelected", label: "Download Selected", action: baseActions.downloadSelected, keys: "" },
        { id: "saveAll", label: "Save All", action: baseActions.saveAll, keys: "Ctrl+Shift+S" },
        { id: "reopenClosedTab", label: "Reopen Closed Tab", action: baseActions.reopenClosedTab, keys: "Ctrl+Shift+T" },
        { id: "openRecent", label: "Open Recent File", action: baseActions.openRecent, keys: "" },
        { id: "undo", label: "Undo", action: baseActions.undo, keys: "Ctrl+Z" },
        { id: "redo", label: "Redo", action: baseActions.redo, keys: "Ctrl+Shift+Z" },
        { id: "selectForCompare", label: "Select File for Compare", action: baseActions.selectForCompare, keys: "" },
        { id: "compareWithSelected", label: "Compare with Selected File", action: baseActions.compareWithSelected, keys: "" },
        { id: "exitCompare", label: "Exit Compare Mode", action: baseActions.exitCompare, keys: "" }
    ];

    return { commands, actions: baseActions };
}

const commandRegistry = buildCommandRegistry();

function buildCommandPaletteEntries(commands){
    return commands.map((command)=>(
        {
            id: command.id,
            label: command.label,
            hint: command.keys || "",
            searchText: `${command.label} ${command.keys || ""}`.toLowerCase(),
            action: async ()=>{
                hideCommandPalette();
                await command.action();
            }
        }
    ));
}

function buildFilePaletteEntries(paths){
    return paths.map((path)=>(
        {
            id: path,
            label: basename(path),
            hint: path,
            name: basename(path).toLowerCase(),
            path: path,
            searchText: `${basename(path)} ${path}`.toLowerCase(),
            action: async ()=>{
                hideCommandPalette();
                await openFile(path);
            }
        }
    ));
}

function scorePaletteEntry(entry, filter){
    if(paletteMode !== "files"){
        const label = entry.label.toLowerCase();
        if(label === filter) return 0;
        if(label.startsWith(filter)) return 1;
        if(entry.searchText.includes(filter)) return 2;
        return 3;
    }

    const name = entry.name || entry.label.toLowerCase();
    const path = (entry.path || entry.label).toLowerCase();
    if(name === filter) return 0;
    if(name.startsWith(filter)) return 1;
    if(path.startsWith(filter)) return 2;
    if(name.includes(filter)) return 3;
    if(path.includes(filter)) return 4;
    return 5;
}

function filterPaletteEntries(filter){
    const normalizedFilter = filter.toLowerCase().trim();
    if(!normalizedFilter){
        return paletteEntries.slice(0, 200);
    }

    const terms = normalizedFilter.split(/\s+/).filter(Boolean);
    return paletteEntries
        .filter((entry)=> terms.every((term)=> entry.searchText.includes(term)))
        .sort((left, right)=>{
            const scoreDiff = scorePaletteEntry(left, normalizedFilter) - scorePaletteEntry(right, normalizedFilter);
            if(scoreDiff !== 0) return scoreDiff;
            return left.label.localeCompare(right.label);
        })
        .slice(0, 200);
}

function renderPaletteItems(filter="", preserveHighlight=false){
    const container = document.getElementById("palette-items");
    const emptyMessage = document.getElementById("command-palette").dataset.emptyMessage || "No results found";

    paletteFilteredEntries = filterPaletteEntries(filter);
    if(!preserveHighlight){
        paletteHighlightIndex = 0;
    } else if(paletteFilteredEntries.length){
        paletteHighlightIndex = Math.max(0, Math.min(paletteHighlightIndex, paletteFilteredEntries.length - 1));
    } else {
        paletteHighlightIndex = 0;
    }

    container.innerHTML = "";
    for(const [index, entry] of paletteFilteredEntries.entries()){
        const item = document.createElement("div");
        item.className = `palette-item${index === paletteHighlightIndex ? " highlighted" : ""}`;
        item.dataset.index = index;

        const label = document.createElement("span");
        label.textContent = entry.label;

        const hint = document.createElement("span");
        hint.className = "palette-hint";
        hint.textContent = entry.hint || "";

        item.appendChild(label);
        item.appendChild(hint);
        item.onmouseenter = ()=>{
            paletteHighlightIndex = index;
            renderPaletteItems(document.getElementById("palette-input").value, true);
        };
        item.onclick = async ()=>{
            await entry.action();
        };

        container.appendChild(item);
    }

    if(!paletteFilteredEntries.length){
        const msg = document.createElement("div");
        msg.style.cssText = "padding:12px;color:#888;text-align:center;";
        msg.textContent = emptyMessage;
        container.appendChild(msg);
    }
}

async function activateHighlightedPaletteEntry(){
    const entry = paletteFilteredEntries[paletteHighlightIndex];
    if(entry){
        await entry.action();
    }
}

function openPalette(mode, entries, options={}){

    input.focus();
}

function basename(path){
    return path.split('/').pop() || path;
}

function dirname(path){
    const idx = path.lastIndexOf('/');
    return idx === -1 ? "" : path.slice(0, idx);
}

function joinPath(parent, name){
    return parent ? `${parent}/${name}` : name;
}

function getTabElement(path){
    return Array.from(document.querySelectorAll(".tab"))
        .find(t => t.dataset.path === path) || null;
}

function getActiveEditorInstance(){
    return compareMode && diffEditor ? diffEditor.getModifiedEditor() : editor;
}

function trackFileMeta(path, meta){
    path = normalizePath(path);
    if(meta){
        fileMetadata[path] = meta;
    } else {
        delete fileMetadata[path];
    }
}

function clearAutoSaveTimer(path){
    if(autoSaveTimers[path]){
        clearTimeout(autoSaveTimers[path]);
        delete autoSaveTimers[path];
    }
}

function clearFileState(path){
    clearAutoSaveTimer(path);
    delete saveInFlight[path];
    delete fileMetadata[path];
    delete remoteFileSnapshots[path];
    delete conflictFiles[path];
    delete suppressModelChanges[path];
    delete imageFiles[path];
}

function withSuppressedModelChanges(path, callback){
    suppressModelChanges[path] = (suppressModelChanges[path] || 0) + 1;
    try {
        callback();
    } finally {
        suppressModelChanges[path] -= 1;
        if(suppressModelChanges[path] <= 0){
            delete suppressModelChanges[path];
        }
    }
}

function setModelContent(path, content, options={}){
    const model = models[path];
    if(!model) return;

    const activeEditor = getActiveEditorInstance();
    const restoreViewState = !compareMode && currentFile === path && activeEditor === editor;
    const viewState = restoreViewState ? editor.saveViewState() : null;

    withSuppressedModelChanges(path, ()=>{
        model.setValue(content);
    });

    dirtyFiles[path] = !!options.markDirty;
    updateTabState(path);

    if(viewState && currentFile === path && !compareMode){
        editor.restoreViewState(viewState);
    }

    updateStatus();
}

function setExplorerHidden(hidden){
    const explorer = document.getElementById("explorer");
    const divider = document.getElementById("divider");

    explorerHidden = hidden;
    explorer.classList.toggle("hidden", hidden);
    divider.classList.toggle("explorer-hidden", hidden);
    divider.style.cursor = hidden ? "pointer" : "col-resize";
}

function toggleExplorer(){
    setExplorerHidden(!explorerHidden);
}

function collectFilePaths(nodes, result=[]){
    for(const node of nodes || []){
        if(node.type === "file"){
            result.push(normalizePath(node.path));
        } else if(node.type === "folder"){
            collectFilePaths(node.children || [], result);
        }
    }
    return result;
}

function setStatus(message, isError=false){
    const status = document.getElementById("statusbar");
    status.innerText = message;
    status.style.background = isError ? "#b42318" : "#007acc";
}

function normalizePath(path){
    return String(path || "").replace(/\\/g, '/');
}

function formatBytes(bytes){
    if(typeof bytes !== "number" || Number.isNaN(bytes) || bytes < 0) return "";
    const units = ["B", "KB", "MB", "GB", "TB"];
    let value = bytes;
    let unitIndex = 0;
    while(value >= 1024 && unitIndex < units.length - 1){
        value /= 1024;
        unitIndex += 1;
    }
    const rounded = value >= 10 || unitIndex === 0 ? value.toFixed(0) : value.toFixed(1);
    return `${rounded} ${units[unitIndex]}`;
}

function isImageFile(path){
    return !!imageFiles[normalizePath(path)];
}

function buildImagePreviewPlaceholder(path){
    return [
        `Image preview: ${basename(path)}`,
        "",
        "This file is shown in preview mode and is not editable in the text editor."
    ].join("\n");
}

function updateTreeSelectionStyles(){
    document.querySelectorAll(".tree-item").forEach((el)=>{
        const path = normalizePath(el.dataset.path);
        const isSelected = selectedTreePaths.has(path);
        el.classList.toggle("selected", isSelected);
        el.classList.toggle("multi-selected", isSelected && path !== selectedTreePath);
    });
}

function clearTreeSelection(){
    selectedTreePath = null;
    lastSelectedTreePath = null;
    selectedTreePaths.clear();
    updateTreeSelectionStyles();
}

function getSelectedTreePaths(targetPath=""){
    const normalizedTarget = normalizePath(targetPath);
    if(selectedTreePaths.size){
        if(normalizedTarget && !selectedTreePaths.has(normalizedTarget)){
            return [normalizedTarget];
        }
        return Array.from(selectedTreePaths);
    }

    if(normalizedTarget) return [normalizedTarget];
    return selectedTreePath ? [selectedTreePath] : [];
}

function setTreeSelection(path, options={}){
    const normalizedPath = normalizePath(path);
    if(!normalizedPath){
        clearTreeSelection();
        return;
    }

    const additive = !!options.additive;
    if(additive){
        if(selectedTreePaths.has(normalizedPath)){
            selectedTreePaths.delete(normalizedPath);
            if(!selectedTreePaths.size){
                clearTreeSelection();
                return;
            }
        } else {
            selectedTreePaths.add(normalizedPath);
        }
    } else {
        selectedTreePaths.clear();
        selectedTreePaths.add(normalizedPath);
    }

    selectedTreePath = normalizedPath;
    lastSelectedTreePath = normalizedPath;
    updateTreeSelectionStyles();
}

function cancelInlineEdit(){
    if(!inlineEditState) return;
    const input = inlineEditState.input;
    const originalName = inlineEditState.originalName;
    const container = inlineEditState.container;
    const isRoot = inlineEditState.isRoot;

    input.remove();
    inlineEditState = null;
    pendingInlineEdit = false;

    if(isRoot){
        // Remove root-level placeholder
        if(container.parentNode) container.parentNode.removeChild(container);
    } else {
        // Restore label for tree item
        const label = document.createElement("span");
        label.className = "tree-label";
        label.textContent = originalName;
        container.appendChild(label);
    }
}

function startInlineEdit(nodePath, operationType="rename"){
    if(inlineEditState) cancelInlineEdit();

    let node = null;

    // For root level create, show inline input at top of tree
    if(nodePath === "" && operationType !== "rename"){
        const tree = document.getElementById("tree");
        const placeholder = document.createElement("div");
        placeholder.style.cssText = "padding:4px 8px;margin-bottom:4px;";
        
        const input = document.createElement("input");
        input.className = "inline-input";
        input.type = "text";
        input.placeholder = `New ${operationType} name...`;
        input.spellcheck = false;
        
        placeholder.appendChild(input);
        tree.insertBefore(placeholder, tree.firstChild);
        
        inlineEditState = {
            nodePath,
            operationType,
            originalName: "",
            input,
            container: placeholder,
            isRoot: true
        };
        
        input.focus();
        pendingInlineEdit = true;
        
        async function commitEdit(newValue){
            if(!newValue){
                cancelInlineEdit();
                return;
            }
            input.disabled = true;
            try {
                await createItemWithPath(operationType, normalizePath(newValue));
            } finally {
                input.disabled = false;
                cancelInlineEdit();
            }
        }
        
        input.addEventListener("blur", ()=> commitEdit(input.value));
        input.addEventListener("keydown", (event)=>{
            if(event.key === "Enter"){
                event.stopPropagation();
                commitEdit(input.value);
            } else if(event.key === "Escape"){
                event.stopPropagation();
                cancelInlineEdit();
            }
        });
        return;
    }

    node = document.querySelector(`.tree-item[data-path="${nodePath}"]`);
    if(!node) return;

    const label = node.querySelector(".tree-label");
    if(!label) return;

    const originalName = label.textContent;
    label.remove();

    const input = document.createElement("input");
    input.className = "inline-input";
    input.type = "text";
    input.value = operationType === "rename" ? originalName : "";
    input.spellcheck = false;

    inlineEditState = {
        nodePath,
        operationType,
        originalName,
        input,
        container: node
    };

    node.appendChild(input);
    input.focus();
    if(operationType === "rename") input.select();
    pendingInlineEdit = true;

    async function commitEdit(newValue){
        if(!newValue || (operationType === "rename" && newValue === originalName)){
            cancelInlineEdit();
            return;
        }

        input.disabled = true;
        try {
            if(operationType === "rename"){
                await renamePath(nodePath, newValue);
            } else {
                const targetPath = normalizePath(joinPath(nodePath, newValue));
                await createItemWithPath(operationType, targetPath);
            }
        } finally {
            input.disabled = false;
            cancelInlineEdit();
        }
    }

    input.addEventListener("blur", ()=> commitEdit(input.value));
    input.addEventListener("keydown", (event)=>{
        if(event.key === "Enter"){
            event.stopPropagation();
            commitEdit(input.value);
        } else if(event.key === "Escape"){
            event.stopPropagation();
            cancelInlineEdit();
        }
    });
}

    const menu = document.getElementById("explorer-context-menu");

function getDownloadUrl(path){
    return `/download?path=${encodeURIComponent(normalizePath(path))}`;
}

function getDownloadFilename(contentDisposition, fallbackName){
    if(!contentDisposition) return fallbackName;
    const utf8Match = contentDisposition.match(/filename\*=UTF-8''([^;]+)/i);
    if(utf8Match?.[1]){
        try {
            return decodeURIComponent(utf8Match[1].trim());
        } catch {
            return utf8Match[1].trim();
        }
    }

    const simpleMatch = contentDisposition.match(/filename="?([^";]+)"?/i);
    return simpleMatch?.[1]?.trim() || fallbackName;
}

function toUniquePaths(paths){
    return Array.from(new Set((paths || []).map((path)=>normalizePath(path)).filter(Boolean)));
}

function pruneNestedPaths(paths){
    const ordered = toUniquePaths(paths).sort((left, right)=> left.length - right.length);
    const result = [];

    for(const path of ordered){
        const isNested = result.some((parent)=> path === parent || path.startsWith(`${parent}/`));
        if(!isNested) result.push(path);
    }

    return result;
}

function downloadPath(path){
    const normalizedPath = normalizePath(path);
    if(!normalizedPath){
        setStatus("Invalid path", true);
        return;
    }

    const link = document.createElement("a");
    link.href = getDownloadUrl(normalizedPath);
    link.download = "";
    document.body.appendChild(link);
    link.click();
    link.remove();

    setStatus(`Downloading ${basename(normalizedPath)}...`);
}

async function downloadSelectedPaths(paths){
    const normalizedPaths = toUniquePaths(paths);
    if(!normalizedPaths.length){
        setStatus("No items selected", true);
        return;
    }

    if(normalizedPaths.length === 1){
        downloadPath(normalizedPaths[0]);
        return;
    }

    try {
        const response = await fetch("/download-selected", {
            method:"POST",
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({ paths: normalizedPaths })
        });

        if(response.status === 401){
            window.location.href = "/login";
            return;
        }

        if(!response.ok){
            let payload = {};
            try {
                payload = await response.json();
            } catch {
                payload = {};
            }
            throw new Error(payload.error || `Request failed (${response.status})`);
        }

        const fileBlob = await response.blob();
        const filename = getDownloadFilename(
            response.headers.get("Content-Disposition") || "",
            "selected-items.zip"
        );

        const blobUrl = URL.createObjectURL(fileBlob);
        const link = document.createElement("a");
        link.href = blobUrl;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(blobUrl);

        setStatus(`Downloading ${normalizedPaths.length} selected items...`);
    } catch (error) {
        setStatus(`Download failed: ${error.message}`, true);
    }
}

async function downloadSelectedFromExplorer(){
    const selected = getSelectedTreePaths();
    if(!selected.length){
        setStatus("Select one or more files or folders first", true);
        return;
    }
    await downloadSelectedPaths(selected);
}

async function deleteSelectedPaths(paths){
    const targets = pruneNestedPaths(paths);
    if(!targets.length) return;

    if(targets.length === 1){
        await deletePath(targets[0]);
        return;
    }

    const confirmed = confirm(`Delete ${targets.length} selected items?`);
    if(!confirmed) return;

    try {
        for(const target of targets){
            const data = await requestJson("/delete", {
                method:"POST",
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({ path: normalizePath(target) })
            });
            if(typeof data.treeVersion === "string"){
                treeVersion = data.treeVersion;
            }

            const targetPrefix = `${target}/`;
            const affectedTabs = Object.keys(models).filter((key)=> key === target || key.startsWith(targetPrefix));
            for(const tabPath of affectedTabs){
                closeTab(tabPath, true);
            }
        }

        if(compareMode){
            const comparePaths = [compareOriginalPath, compareModifiedPath].map((path)=> normalizePath(path));
            if(targets.some((target)=> comparePaths.some((comparePath)=> comparePath === target || comparePath.startsWith(`${target}/`)))){
                exitCompareMode();
            }
        }

        await loadTree();
        clearTreeSelection();
    } catch (error) {
        setStatus(`Delete failed: ${error.message}`, true);
    }
}

function showImagePreview(path){

function getContextActions(target){
    const targetPath = normalizePath(target.path || "");
    const selectedPaths = getSelectedTreePaths(targetPath);
    const multiSelection = selectedPaths.length > 1;

    if(target.type === "file"){
        const actions = [
            { label: "Open", action: ()=>openFile(target.path) },
            { label: "Download File", action: ()=>downloadPath(targetPath) },
        ];

        if(multiSelection){
            actions.push({
                label: `Download Selected (${selectedPaths.length})`,
                action: ()=>downloadSelectedPaths(selectedPaths)
            });
        }

        actions.push(
            { type: "separator" },
            { label: "Select for Compare", action: ()=>{
                compareCandidatePath = normalizePath(target.path);
                setStatus(`Selected for compare: ${basename(compareCandidatePath)}`);
                hideContextMenu();
            }},
            { label: "Compare with Selected", action: async ()=>{
                if(!compareCandidatePath){
                    setStatus("No file selected for compare", true);
                    return;
                }
                hideContextMenu();
                await startCompare(compareCandidatePath, target.path);
            }},
            { type: "separator" },
        );

        if(!multiSelection){
            actions.push({ label: "Rename", action: ()=>startInlineEdit(target.path, "rename") });
            actions.push({ label: "Delete", action: ()=>deletePath(target.path) });
        } else {
            actions.push({ label: `Delete Selected (${selectedPaths.length})`, action: ()=>deleteSelectedPaths(selectedPaths) });
        }

        return actions;
    }

    if(target.type === "folder"){
        const actions = [
            { label: "New File", action: ()=>startInlineEdit(target.path, "file") },
            { label: "New Folder", action: ()=>startInlineEdit(target.path, "folder") },
            { type: "separator" },
            { label: "Download Folder", action: ()=>downloadPath(targetPath) },
        ];

        if(multiSelection){
            actions.push({ label: `Download Selected (${selectedPaths.length})`, action: ()=>downloadSelectedPaths(selectedPaths) });
        }

        actions.push({ type: "separator" });
        if(!multiSelection){
            actions.push({ label: "Rename", action: ()=>startInlineEdit(target.path, "rename") });
            actions.push({ label: "Delete", action: ()=>deletePath(target.path) });
        } else {
            actions.push({ label: `Delete Selected (${selectedPaths.length})`, action: ()=>deleteSelectedPaths(selectedPaths) });
        }

        return actions;
    }

    const actions = [
        { label: "New File", action: ()=>startInlineEdit("", "file") },
        { label: "New Folder", action: ()=>startInlineEdit("", "folder") },
        { type: "separator" },
        { label: "Refresh Explorer", action: ()=>loadTree() }
    ];

    if(selectedTreePaths.size){
        actions.splice(3, 0, {
            label: `Download Selected (${selectedTreePaths.size})`,
            action: ()=>downloadSelectedPaths(Array.from(selectedTreePaths))
        });
    }

    return actions;
}

function openContextMenu(x, y, target){
    menuTarget = target;
    const menu = document.getElementById("explorer-context-menu");
    menu.innerHTML = "";

    for(const item of getContextActions(target)){
        if(item.type === "separator"){
            const separator = document.createElement("div");
            separator.className = "context-separator";
            menu.appendChild(separator);
            continue;
        }

        const button = document.createElement("button");
        button.className = "context-item";
        button.type = "button";
        button.textContent = item.label;
        button.onclick = async (event)=>{
            event.stopPropagation();
            hideContextMenu();
            await item.action();
        };
        menu.appendChild(button);
    }

    menu.style.display = "block";
    const { innerWidth, innerHeight } = window;
    const rect = menu.getBoundingClientRect();
    const left = Math.min(x, innerWidth - rect.width - 6);
    const top = Math.min(y, innerHeight - rect.height - 6);
    menu.style.left = `${Math.max(6, left)}px`;
    menu.style.top = `${Math.max(6, top)}px`;
}

async function requestJson(url, options={}){
    const response = await fetch(url, options);
    let data = {};
    try {
        data = await response.json();
    } catch {
        data = {};
    }

    if(!response.ok){
        if(response.status === 401){
            window.location.href = "/login";
            throw new Error("Authentication required");
        }
        const message = data.error || `Request failed (${response.status})`;
        const error = new Error(message);
        error.payload = data;
        error.status = response.status;
        throw error;
    }

    return data;
}

function detectLanguage(file){
    const ext = file.split('.').pop().toLowerCase();
    const map = {
        py:"python",
        js:"javascript",
        ts:"typescript",
        html:"html",
        css:"css",
        json:"json",
        md:"markdown",
        cpp:"cpp",
        c:"c",
        java:"java",
        go:"go",
        rs:"rust",
        php:"php",
        sh:"shell",
        yml:"yaml",
        yaml:"yaml"
    };
    return map[ext] || "plaintext";
}

function bindModelChangeListener(path){
    if(modelListeners[path]){
        modelListeners[path].dispose();
        delete modelListeners[path];
    }

    if(!models[path] || isImageFile(path)) return;

    modelListeners[path] = models[path].onDidChangeContent(()=>{
        if(suppressModelChanges[path]) return;
        dirtyFiles[path] = true;
        updateTabState(path);
        scheduleAutoSave(path);
        if(path === currentFile){
            updateStatus();
        }
    });
}

function scheduleAutoSave(path){
    path = normalizePath(path);
    clearAutoSaveTimer(path);

    if(!dirtyFiles[path] || conflictFiles[path]) return;

    autoSaveTimers[path] = setTimeout(()=>{
        save(path, { reason: "autosave" });
    }, AUTO_SAVE_DELAY);

    if(path === currentFile){
        updateStatus();
    }
}

async function reloadFileFromDisk(path, reason="updated"){
    const data = await requestJson("/open", {
        method:"POST",
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({path})
    });

    const nextIsImage = !!data.isImage;
    const previousIsImage = isImageFile(path);

    if(nextIsImage){
        imageFiles[path] = true;
    } else {
        delete imageFiles[path];
    }

    if(previousIsImage !== nextIsImage){
        if(modelListeners[path]){
            modelListeners[path].dispose();
            delete modelListeners[path];
        }

        if(models[path]){
            models[path].dispose();
        }

        models[path] = monaco.editor.createModel(
            nextIsImage ? buildImagePreviewPlaceholder(path) : data.content,
            nextIsImage ? "plaintext" : detectLanguage(path)
        );
        bindModelChangeListener(path);
        dirtyFiles[path] = false;
    } else {
        setModelContent(path, nextIsImage ? buildImagePreviewPlaceholder(path) : data.content, { markDirty: false });
    }

    trackFileMeta(path, data.meta);
    delete remoteFileSnapshots[path];
    delete conflictFiles[path];

    if(path === currentFile && !compareMode){
        if(nextIsImage){
            editor.updateOptions({ readOnly: true });
            showImagePreview(path);
        } else {
            editor.updateOptions({ readOnly: false });
            hideImagePreview();
            editor.setModel(models[path]);
        }
    }

    if(path === currentFile){
        setStatus(`Reloaded ${basename(path)} from disk (${reason})`);
    }

    return data;
}

async function handleRemoteMissingFile(path){
    path = normalizePath(path);
    clearAutoSaveTimer(path);

    if(!models[path]){
        clearFileState(path);
        return;
    }

    if(dirtyFiles[path]){
        conflictFiles[path] = true;
        delete fileMetadata[path];
        remoteFileSnapshots[path] = "";
        updateTabState(path);
        if(path === currentFile){
            setStatus(`${basename(path)} was deleted on disk. Save to recreate or close the tab.`, true);
        }
        return;
    }

    closeTab(path, true);
    clearFileState(path);
    removeRecentFile(path);
    setStatus(`${basename(path)} was deleted on disk`, true);
}

async function handleRemoteFileChange(path, incomingMeta){
    path = normalizePath(path);

    if(!models[path]){
        trackFileMeta(path, incomingMeta);
        return;
    }

    if(dirtyFiles[path]){
        clearAutoSaveTimer(path);
        conflictFiles[path] = true;
        updateTabState(path);

        try {
            const diskData = await requestJson("/open", {
                method:"POST",
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({path})
            });
            remoteFileSnapshots[path] = diskData.content;
            trackFileMeta(path, diskData.meta);
        } catch {
            remoteFileSnapshots[path] = "";
            trackFileMeta(path, incomingMeta);
        }

        if(path === currentFile){
            setStatus(`${basename(path)} changed on disk. Save to overwrite or compare first.`, true);
        }
        return;
    }

    try {
        await reloadFileFromDisk(path, "external update");
    } catch (error) {
        if(error.status === 404){
            await handleRemoteMissingFile(path);
            return;
        }
        throw error;
    }
}

async function pollWorkspaceUpdates(){
    if(document.hidden) return;

    try {
        const watchedPaths = Object.keys(models);
        const data = await requestJson("/watch", {
            method:"POST",
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                paths: watchedPaths,
                knownTreeVersion: treeVersion
            })
        });

        if(typeof data.treeVersion === "string"){
            treeVersion = data.treeVersion;
        }

        if(data.treeChanged){
            await loadTree();
        }

        for(const [path, info] of Object.entries(data.files || {})){
            const knownVersion = fileMetadata[path]?.version || null;
            const nextVersion = info?.meta?.version || null;

            if(!info.exists){
                await handleRemoteMissingFile(path);
                continue;
            }

            if(!knownVersion){
                trackFileMeta(path, info.meta);
                continue;
            }

            if(knownVersion !== nextVersion){
                await handleRemoteFileChange(path, info.meta);
            }
        }
    } catch (error) {
        console.error("Workspace watch failed", error);
    }
}

function ensureWatchPolling(){
    if(watchTimer) return;
    watchTimer = setInterval(()=>{
        pollWorkspaceUpdates();
    }, WATCH_INTERVAL);
}

async function loadTree(){
    try {
        const data = await requestJson("/tree");
        const nodes = Array.isArray(data) ? data : (data.tree || []);
        const tree = document.getElementById("tree");

        tree.innerHTML = "";
        tree.appendChild(buildTree(nodes));
        treeFilePaths = collectFilePaths(nodes, []);
        if(typeof data.treeVersion === "string"){
            treeVersion = data.treeVersion;
        }

        const availablePaths = new Set(
            Array.from(document.querySelectorAll(".tree-item")).map((element)=> normalizePath(element.dataset.path))
        );
        selectedTreePaths = new Set(Array.from(selectedTreePaths).filter((path)=> availablePaths.has(path)));
        if(selectedTreePath && !selectedTreePaths.has(selectedTreePath)){
            selectedTreePath = selectedTreePaths.size ? Array.from(selectedTreePaths)[0] : null;
        }

        updateTreeSelectionStyles();
    } catch (error) {
        setStatus(`Tree error: ${error.message}`, true);
    }
}

function buildTree(nodes){
    const list = document.createElement("ul");

    for(let n of nodes){
        const item = document.createElement("li");
        const node = document.createElement("div");
        node.className = `tree-item ${n.type === "folder" ? "folder closed" : "file"}`;
        node.dataset.path = n.path;

        const caret = document.createElement("span");
        caret.className = "tree-caret";

        const icon = document.createElement("span");
        icon.className = "tree-icon";

        const label = document.createElement("span");
        label.className = "tree-label";
        label.textContent = n.name;

        if(n.type === "folder"){
            setIcon(caret, "chevronRight");
            setIcon(icon, "folder");
        } else {
            setIcon(icon, "file");
        }

        node.appendChild(caret);
        node.appendChild(icon);
        node.appendChild(label);

        if(n.type === "folder"){
            const childrenContainer = document.createElement("div");
            childrenContainer.style.display = "none";
            childrenContainer.style.marginLeft = "8px";
            childrenContainer.appendChild(buildTree(n.children || []));

            node.onclick = function(event){
                const path = this.dataset.path;
                const additive = event.ctrlKey || event.metaKey;
                setTreeSelection(path, { additive });
                if(additive) return;

                const isClosed = this.classList.contains("closed");
                this.classList.toggle("closed");
                childrenContainer.style.display = isClosed ? "block" : "none";
                setIcon(caret, isClosed ? "chevronDown" : "chevronRight");
            };

            node.oncontextmenu = function(event){
                event.preventDefault();
                const path = this.dataset.path;
                if(!selectedTreePaths.has(path)){
                    setTreeSelection(path);
                }
                openContextMenu(event.clientX, event.clientY, {
                    type: "folder",
                    path
                });
            };

            item.appendChild(node);
            item.appendChild(childrenContainer);
        } else {
            node.onclick = function(event){
                const path = this.dataset.path;
                const additive = event.ctrlKey || event.metaKey;
                setTreeSelection(path, { additive });
                if(additive) return;
                openFile(path);
            };

            node.oncontextmenu = function(event){
                event.preventDefault();
                const path = this.dataset.path;
                if(!selectedTreePaths.has(path)){
                    setTreeSelection(path);
                }
                openContextMenu(event.clientX, event.clientY, {
                    type: "file",
                    path
                });
            };

            item.appendChild(node);
        }

        list.appendChild(item);
    }

    return list;
}

async function openFile(path){
    path = normalizePath(path);

    if(models[path]){
        setActive(path);
        return;
    }

    try {
        const data = await requestJson("/open",{
            method:"POST",
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({path})
        });

        const isImage = !!data.isImage;
        if(isImage){
            imageFiles[path] = true;
        } else {
            delete imageFiles[path];
        }

        models[path] = monaco.editor.createModel(
            isImage ? buildImagePreviewPlaceholder(path) : data.content,
            isImage ? "plaintext" : detectLanguage(path)
        );

        trackFileMeta(path, data.meta);
        delete conflictFiles[path];
        delete remoteFileSnapshots[path];

        bindModelChangeListener(path);

        dirtyFiles[path] = false;
        createTab(path);
        setActive(path);
        addRecentFile(path);
    } catch (error) {
        setStatus(`Open failed: ${error.message}`, true);
    }
}

function createTab(path){
    const tab = document.createElement("div");
    tab.className = "tab";
    tab.dataset.path = path;

    const label = document.createElement("span");
    label.className = "tab-label";
    label.textContent = basename(path);

    const pinIcon = document.createElement("span");
    pinIcon.className = "pin-icon";
    pinIcon.innerHTML = "📌";
    pinIcon.title = "Pin tab";
    pinIcon.onclick = (e) => {
        e.stopPropagation();
        togglePinTab(path);
    };

    const close = document.createElement("span");
    close.className = "close";
    close.textContent = "×";

    tab.appendChild(label);
    tab.appendChild(pinIcon);
    tab.appendChild(close);

    tab.onclick = () => setActive(path);

    close.onclick = (e) => {
        e.stopPropagation();
        closeTab(path);
    };

    document.getElementById("tabs").appendChild(tab);
    updateTabState(path);
}

function setActive(path){
    if(!models[path]) return;

    const previousFile = currentFile;
    if(previousFile && previousFile !== path && dirtyFiles[previousFile] && !conflictFiles[previousFile]){
        save(previousFile, { reason: "autosave" });
    }

    currentFile = path;
    editor.setModel(models[path]);
    if(isImageFile(path)){
        editor.updateOptions({ readOnly: true });
        showImagePreview(path);
    } else {
        hideImagePreview();
        editor.updateOptions({ readOnly: false });
    }
    setTreeSelection(path);

    document.querySelectorAll(".tab").forEach(t=>{
        t.classList.toggle("active", t.dataset.path===path);
    });

    updateStatus();
}

function closeTab(path, force=false){
    if(!models[path]) return;

    if(!force && dirtyFiles[path]){
        const shouldClose = confirm(`Close without saving ${basename(path)}?`);
        if(!shouldClose) return;
    }

    clearAutoSaveTimer(path);

    if(modelListeners[path]){
        modelListeners[path].dispose();
        delete modelListeners[path];
    }

    models[path].dispose();
    delete models[path];
    delete dirtyFiles[path];
    delete pinnedTabs[path];
    delete imageFiles[path];

    const tab = getTabElement(path);
    if(tab) tab.remove();

    closedTabs.push(path);
    if(closedTabs.length > 20) closedTabs.shift();

    if(compareMode && (path === compareOriginalPath || path === compareModifiedPath || path === compareReturnPath)){
        exitCompareMode();
    }

    clearFileState(path);

    if(currentFile === path){
        const remainingTabs = Array.from(document.querySelectorAll(".tab"));
        if(remainingTabs.length){
            setActive(remainingTabs[remainingTabs.length - 1].dataset.path);
        } else {
            if(compareMode) exitCompareMode();
            editor.setModel(null);
            hideImagePreview();
            currentFile = null;
            setStatus(READY_STATUS);
        }
    }
}

function updateTabState(path){
    const tab = getTabElement(path);
    if(!tab) return;
    tab.classList.toggle("dirty", !!dirtyFiles[path]);
    tab.title = conflictFiles[path] ? "File changed on disk" : "";
    const pinIcon = tab.querySelector(".pin-icon");
    if(pinIcon) pinIcon.classList.toggle("pinned", !!pinnedTabs[path]);
}

function togglePinTab(path){
    pinnedTabs[path] = !pinnedTabs[path];
    updateTabState(path);
    reorganizeTabs();
}

function reorganizeTabs(){
    const tabs = document.getElementById("tabs");
    const tabEls = Array.from(tabs.querySelectorAll(".tab"));
    const pinned = tabEls.filter(t => pinnedTabs[t.dataset.path]);
    const unpinned = tabEls.filter(t => !pinnedTabs[t.dataset.path]);
    
    tabs.innerHTML = "";
    pinned.forEach(t => tabs.appendChild(t));
    unpinned.forEach(t => tabs.appendChild(t));
}

async function save(path=currentFile, options={}){
    path = normalizePath(path);
    if(!path || compareMode) return false;
    if(!models[path] || saveInFlight[path]) return false;
    if(isImageFile(path)){
        if(path === currentFile){
            setStatus("Image previews are read-only in the editor", true);
        }
        return false;
    }

    const reason = options.reason || "manual";
    const force = !!options.force;

    clearAutoSaveTimer(path);

    if(reason === "manual" && conflictFiles[path] && !force){
        const shouldOverwrite = confirm(`${basename(path)} changed on disk. Press OK to overwrite the disk version with your local changes. Press Cancel to compare first.`);
        if(!shouldOverwrite){
            if(remoteFileSnapshots[path] !== undefined){
                await startCompareWithContent(path, remoteFileSnapshots[path], `Disk: ${basename(path)}`);
            }
            return false;
        }
        return save(path, { ...options, force: true });
    }

    const model = models[path];
    const activeEditor = getActiveEditorInstance();
    const content = path === currentFile && !compareMode && activeEditor ? activeEditor.getValue() : model.getValue();

    saveInFlight[path] = reason;
    let refreshStatus = false;
    if(path === currentFile){
        updateStatus();
    }

    try {
        const data = await requestJson("/save",{
            method:"POST",
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                path,
                content,
                expectedVersion: fileMetadata[path]?.version || null,
                force
            })
        });

        dirtyFiles[path] = false;
        delete conflictFiles[path];
        delete remoteFileSnapshots[path];
        trackFileMeta(path, data.meta);
        if(typeof data.treeVersion === "string"){
            treeVersion = data.treeVersion;
        }
        updateTabState(path);
        refreshStatus = path === currentFile;
        return true;
    } catch (error) {
        if(error.status === 409 && error.payload?.code === "version_conflict"){
            conflictFiles[path] = true;
            remoteFileSnapshots[path] = error.payload.currentContent || "";
            if(error.payload.currentMeta){
                trackFileMeta(path, error.payload.currentMeta);
            }
            updateTabState(path);

            if(reason === "autosave"){
                if(path === currentFile){
                    setStatus(`Autosave paused: ${basename(path)} changed on disk`, true);
                }
            } else {
                const shouldCompare = confirm(`${basename(path)} changed on disk. Press OK to compare, or Cancel to keep your local changes.`);
                if(shouldCompare && remoteFileSnapshots[path] !== undefined){
                    await startCompareWithContent(path, remoteFileSnapshots[path], `Disk: ${basename(path)}`);
                } else if(path === currentFile){
                    setStatus(`Save blocked: ${basename(path)} changed on disk`, true);
                }
            }
            return false;
        }

        if(path === currentFile){
            const label = reason === "autosave" ? "Autosave failed" : "Save failed";
            setStatus(`${label}: ${error.message}`, true);
        }
        return false;
    } finally {
        delete saveInFlight[path];
        if(refreshStatus && path === currentFile){
            updateStatus();
        }
    }
}

async function logout(){
    try {
        await requestJson("/auth/logout", {

function updateStatus(){
    if(compareMode) return;

    if(!currentFile){
        setStatus(READY_STATUS);
        return;
    }

    if(isImageFile(currentFile)){
        const sizeText = formatBytes(fileMetadata[currentFile]?.size);
        const sizeSuffix = sizeText ? ` | ${sizeText}` : "";
        setStatus(`${currentFile} (Image Preview)${sizeSuffix}`);
        return;
    }

    const position = editor ? editor.getPosition() : null;
    let stateLabel = "";

    if(conflictFiles[currentFile]){
        stateLabel = " (Conflict)";
    } else if(saveInFlight[currentFile] === "autosave"){
        stateLabel = " (Autosaving)";
    } else if(saveInFlight[currentFile]){
        stateLabel = " (Saving)";
    } else if(dirtyFiles[currentFile]){
        stateLabel = " (Unsaved)";
    }

    const lineNumber = position?.lineNumber || 1;
    const column = position?.column || 1;
    setStatus(`${currentFile}${stateLabel} | Ln ${lineNumber}, Col ${column}`);
}

function syncRenamedFileInTabs(oldPath, newPath){
    const oldPrefix = `${oldPath}/`;
    const openPaths = Object.keys(models).filter((key)=>
        key === oldPath || key.startsWith(oldPrefix)
    );

    for(const sourcePath of openPaths){
        const targetPath = sourcePath === oldPath
            ? newPath
            : `${newPath}${sourcePath.slice(oldPath.length)}`;
        const hadAutoSaveTimer = !!autoSaveTimers[sourcePath];

        models[targetPath] = models[sourcePath];
        delete models[sourcePath];

        if(modelListeners[sourcePath]){
            modelListeners[targetPath] = modelListeners[sourcePath];
            delete modelListeners[sourcePath];
        }

        if(fileMetadata[sourcePath]){
            fileMetadata[targetPath] = fileMetadata[sourcePath];
            delete fileMetadata[sourcePath];
        }

        if(imageFiles[sourcePath]){
            imageFiles[targetPath] = imageFiles[sourcePath];
            delete imageFiles[sourcePath];
        }

        if(remoteFileSnapshots[sourcePath] !== undefined){
            remoteFileSnapshots[targetPath] = remoteFileSnapshots[sourcePath];
            delete remoteFileSnapshots[sourcePath];
        }

        if(conflictFiles[sourcePath]){
            conflictFiles[targetPath] = conflictFiles[sourcePath];
            delete conflictFiles[sourcePath];
        }

        if(saveInFlight[sourcePath]){
            saveInFlight[targetPath] = saveInFlight[sourcePath];
            delete saveInFlight[sourcePath];
        }

        clearAutoSaveTimer(sourcePath);
        dirtyFiles[targetPath] = dirtyFiles[sourcePath];
        delete dirtyFiles[sourcePath];

        const tab = getTabElement(sourcePath);
        if(tab){
            tab.dataset.path = targetPath;
            const label = tab.querySelector(".tab-label");
            if(label) label.textContent = basename(targetPath);
        }

        if(hadAutoSaveTimer && dirtyFiles[targetPath] && !conflictFiles[targetPath]){
            scheduleAutoSave(targetPath);
        }

        if(currentFile === sourcePath){
            currentFile = targetPath;
        }
    }
}

async function createItem(type, basePath=""){
    // If basePath not provided, use selected tree item or root
    if(!basePath){
        if(selectedTreePath){
            const selected = document.querySelector(`.tree-item[data-path="${selectedTreePath}"]`);
            if(selected && selected.classList.contains("folder")){
                basePath = selectedTreePath;
            } else if(selectedTreePath){
                basePath = dirname(selectedTreePath);
            }
        }
    }
    await startInlineEdit(basePath, type);
}

async function createItemWithPath(type, targetPath){
    if(!targetPath){
        setStatus("Invalid path", true);
        return;
    }

    try {
        const data = await requestJson("/create",{
            method:"POST",
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                path:targetPath,
                type:type
            })
        });
        if(typeof data.treeVersion === "string"){
            treeVersion = data.treeVersion;
        }
        await loadTree();
        setTreeSelection(normalizePath(targetPath));
    } catch (error) {
        setStatus(`Create failed: ${error.message}`, true);
    }
}

async function renamePath(path, newName){
    if(!newName) return;

    const target = normalizePath(joinPath(dirname(path), newName));

    try {
        const data = await requestJson("/rename",{
            method:"POST",
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                old:normalizePath(path),
                new:target
            })
        });

        if(typeof data.treeVersion === "string"){
            treeVersion = data.treeVersion;
        }

        if(compareMode && (normalizePath(path) === compareOriginalPath || normalizePath(path) === compareModifiedPath)){
            exitCompareMode();
        }

        syncRenamedFileInTabs(normalizePath(path), target);
        await loadTree();
        setTreeSelection(target);
    } catch (error) {
        setStatus(`Rename failed: ${error.message}`, true);
    }
}

async function deletePath(path){
    const confirmed = confirm(`Delete ${basename(path)}?`);
    if(!confirmed) return;

    try {
        const data = await requestJson("/delete",{
            method:"POST",
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({path:normalizePath(path)})
        });

        if(typeof data.treeVersion === "string"){
            treeVersion = data.treeVersion;
        }

        const targetPrefix = `${path}/`;
        const affectedTabs = Object.keys(models).filter((key)=>
            key === path || key.startsWith(targetPrefix)
        );

        for(const tabPath of affectedTabs){
            closeTab(tabPath, true);
        }

        if(compareMode && (normalizePath(path) === compareOriginalPath || normalizePath(path) === compareModifiedPath)){
            exitCompareMode();
        }

        await loadTree();
        clearTreeSelection();
    } catch (error) {
        setStatus(`Delete failed: ${error.message}`, true);
    }
}

document.addEventListener("keydown", (event)=>{
    const activeEditor = getActiveEditorInstance();

    if(event.ctrlKey && !event.shiftKey && event.key.toLowerCase() === "p"){
        event.preventDefault();
        showQuickOpenPalette();
    } else if(event.ctrlKey && !event.shiftKey && event.key.toLowerCase() === "b"){
        event.preventDefault();
        commandRegistry.actions.toggleExplorer();
    } else if(event.ctrlKey && !event.shiftKey && event.key.toLowerCase() === "f"){
        event.preventDefault();
        commandRegistry.actions.findInFile();
    } else if(event.ctrlKey && event.shiftKey && event.key === "P"){
        event.preventDefault();
        showCommandPalette();
    } else if(event.ctrlKey && event.shiftKey && event.key === "T"){
        event.preventDefault();
        commandRegistry.actions.reopenClosedTab();
    } else if(event.ctrlKey && event.shiftKey && event.key === "S"){
        event.preventDefault();
        commandRegistry.actions.saveAll();
    } else if(event.ctrlKey && event.key === "z" && !event.shiftKey){
        if(activeEditor && activeEditor.hasTextFocus()){
            event.preventDefault();
            commandRegistry.actions.undo();
        }
    } else if((event.ctrlKey && event.shiftKey && event.key === "Z") || (event.ctrlKey && event.key === "y")){
        if(activeEditor && activeEditor.hasTextFocus()){
            event.preventDefault();
            commandRegistry.actions.redo();
        }
    } else if(event.key === "Delete" && !pendingInlineEdit){
        const selectedPaths = getSelectedTreePaths();
        if(selectedPaths.length){
            event.preventDefault();
            deleteSelectedPaths(selectedPaths);
        }
    }
});

window.addEventListener("blur", ()=>{
    Object.keys(models).forEach((path)=>{
        if(dirtyFiles[path] && !conflictFiles[path]){
            save(path, { reason: "autosave" });
        }
    });
});

document.getElementById("divider").addEventListener("mousedown", function(){
    document.onmousemove = function(e){
        const explorer = document.getElementById("explorer");
        const newWidth = e.clientX;

        if(newWidth < 50){
            if(!explorerHidden){
                setExplorerHidden(true);
            }
        } else {
            if(explorerHidden){
                setExplorerHidden(false);
            }
            explorer.style.width = newWidth + "px";
        }
    };
    document.onmouseup = function(){
        document.onmousemove = null;
    };
});

document.getElementById("divider").addEventListener("click", function(){
    if(explorerHidden){
        const explorer = document.getElementById("explorer");
        setExplorerHidden(false);
        explorer.style.width = "280px";
    }
});
</script>
</body>
</html>
